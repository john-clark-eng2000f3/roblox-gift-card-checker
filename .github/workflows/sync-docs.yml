name: sync-docs

on:
  schedule:
    - cron: "7 */1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: verify docs
        run: |
          set -eu
          f="README.md"
          [ -f "$f" ] || exit 0
          bad=0
          for t in $(grep -oE "\(([^) ]+)\)" "$f" | tr -d "()" || true); do
            case "$t" in
              http*|"#"*) : ;;
              *) [ -e "$t" ] || bad=$((bad + 1)) ;;
            esac
          done
          echo "checked $f: $bad broken local link(s)"

      - name: update
        run: |
          set -eu
          f="README.md"
          [ -f "$f" ] || exit 0
          stamp="<!-- last-checked: $(date -u +%Y-%m-%d) -->"
          if grep -q "^<!-- last-checked: " "$f"; then
            sed -i "s|^<!-- last-checked: .*|$stamp|" "$f"
          else
            printf '\n%s\n' "$stamp" >> "$f"
          fi

      - name: commit
        run: |
          set -eu
          git config user.name "john-clark-eng2000f3"
          git config user.email "279190863+john-clark-eng2000f3@users.noreply.github.com"
          git add -- "README.md"
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh metadata"
          git push
